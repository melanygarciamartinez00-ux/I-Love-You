<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Me amas?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper" id="viewInterface">
        <div class="pixel-window" id="popupWindow">

            <div class="window-bar">
                <span class="window-dot"></span>
                <span class="window-dot"></span>
                <span class="window-dot"></span>
            </div>

            <div class="window-body">
                <h1 class="title-text">¿Me amas?</h1>

                <div class="btn-container">
                    <button class="pixel-btn" onclick="triggerYes()">Sí</button>
                    <button class="pixel-btn" onclick="triggerNo()">No</button>
                </div>
            </div>

        </div>
    </div>

    <!-- RESPUESTA AL PRESIONAR NO -->
    <div class="pixel-smiler" id="smileContainer">
        <div>:) </div>
        <div class="caca-text">Come caca 💩</div>
    </div>

    <!-- ANIMACIÓN AL PRESIONAR SÍ -->
    <div class="neon-center-set" id="neonSet">

        <div class="neon-text">TE AMO</div>

        <svg class="neon-heart-svg" viewBox="0 0 24 24" fill="#ffccff">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
            2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09
            C13.09 3.81 14.76 3 16.5 3
            19.58 3 22 5.42 22 8.5
            c0 3.78-3.4 6.86-8.55 11.54
            L12 21.35z"/>
        </svg>

    </div>

    <!-- FONDO DE TE AMO -->
    <div class="matrix-bg" id="bgContainer"></div>

    <script src="script.js"></script>

</body>
</html>
